# ==============================================================================
# ORQUESTACIÓN DOCKER COMPOSE: PROMETHEUS + GRAFANA + EXPORTERS (OBSERVABILIDAD)
# Proyecto Grupal: Observabilidad de la Gestión de Pedidos E-commerce — Tech Store
# Curso: Introducción a la Telemática — Grupo #3
# ==============================================================================

name: techstore-observabilidad

services:
  # 1. Servidor Principal Prometheus (TSDB y Motor PromQL)
  prometheus:
    image: prom/prometheus:latest
    container_name: techstore-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      observability-net:
        aliases:
          - prometheus

  # 2. Exportador de Sistema Operativo Host (Manual Técnico Prometheus)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: techstore-node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      observability-net:
        aliases:
          - node-exporter

  # 3. Exportador de Observabilidad de Negocio E-commerce (KPIs Reales MySQL K01-K10)
  ecommerce-exporter:
    image: python:3.11-alpine
    container_name: techstore-ecommerce-exporter
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "/app/exporter.py"]
    environment:
      - PORTAL_URL=http://portal-web:80
      - GRAFANA_URL=http://grafana:3000
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin123}
      - EXPORTER_CACHE_TTL=2.0
    ports:
      - "${EXPORTER_PORT:-9101}:9101"
    volumes:
      - ./exporter/exporter.py:/app/exporter.py:ro
      - ./grafana/init/setup_users.py:/app/setup_users.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/api/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      observability-net:
        aliases:
          - ecommerce-exporter

  # 4. Plataforma de Visualización Ejecutiva Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: techstore-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_DEFAULT_THEME=dark
      - GF_AUTH_BASIC_ENABLED=true
      - GF_DEFAULT_INSTANCE_NAME=Grupo3-Telematica-TechStore
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - ecommerce-exporter
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      observability-net:
        aliases:
          - grafana

volumes:
  prometheus-data:
    name: techstore_prometheus-data
  grafana-data:
    name: techstore_grafana-data

networks:
  observability-net:
    name: techstore_observability_net
    driver: bridge
