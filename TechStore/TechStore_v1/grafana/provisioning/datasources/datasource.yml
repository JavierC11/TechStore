# ==============================================================================
# APROVISIONAMIENTO AUTOMÁTICO DE DATASOURCE PROMETHEUS EN GRAFANA
# Proyecto: Observabilidad de la Gestión de Pedidos E-commerce — Grupo #3
# ==============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "5s"
      httpMethod: POST

