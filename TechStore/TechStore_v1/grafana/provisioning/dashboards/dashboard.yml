apiVersion: 1

providers:
  - name: 'Grupo 3 - Observabilidad Telematica'
    orgId: 1
    folder: 'Grupo #3 - Introducción a la Telemática'
    folderUid: 'grupo3-telematica'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

